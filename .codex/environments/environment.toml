# Generated-compatible configuration for the Codex desktop app.
version = 1
name = "GerrisErfolgsTracker"

[setup]
script = '''
set -euo pipefail
cd "${CODEX_WORKTREE_PATH:-$PWD}"

if ! command -v uv >/dev/null 2>&1; then
  echo "uv is required for the Python environment." >&2
  exit 2
fi

uv venv --python 3.12 --allow-existing .venv
.venv/bin/python -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 2)'
uv pip install \
  --python .venv/bin/python \
  -r requirements.txt \
  -r requirements-dev.txt

export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
if [ ! -s "$NVM_DIR/nvm.sh" ]; then
  echo "NVM is required at $NVM_DIR/nvm.sh." >&2
  exit 2
fi
. "$NVM_DIR/nvm.sh"
nvm install
nvm use

npm --prefix web ci
mkdir -p .data /tmp/codex-wrangler
'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"
Write-Error "Use this repository through the Codex WSL agent and its native /home/gerri checkout."
exit 2
'''

[cleanup]
script = "echo \"No project-specific cleanup required.\""

[cleanup.win32]
script = "Write-Host \"No project-specific cleanup required.\""

[[actions]]
name = "Start Streamlit with local data"
icon = "tool"
command = '''
set -euo pipefail
mkdir -p .data
GERRIS_ONEDRIVE_DIR="$PWD/.data" .venv/bin/python -m streamlit run app.py
'''

[[actions]]
name = "Python quality gate"
icon = "tool"
command = '''
set -euo pipefail
.venv/bin/python -m ruff format --check .
.venv/bin/python -m ruff check .
.venv/bin/python -m mypy .
.venv/bin/python -m pytest -q
'''

[[actions]]
name = "Start Sites web application"
icon = "tool"
command = '''
set -euo pipefail
export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
. "$NVM_DIR/nvm.sh"
nvm use >/dev/null
export TMPDIR=/tmp
export WRANGLER_LOG_PATH=/tmp/codex-wrangler
npm --prefix web run dev
'''

[[actions]]
name = "Sites web quality gate"
icon = "tool"
command = '''
set -euo pipefail
export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
. "$NVM_DIR/nvm.sh"
nvm use >/dev/null
export TMPDIR=/tmp
export WRANGLER_LOG_PATH=/tmp/codex-wrangler
npm --prefix web run check
'''

[[actions]]
name = "Complete repository gate"
icon = "tool"
command = '''
set -euo pipefail
.venv/bin/python -m ruff format --check .
.venv/bin/python -m ruff check .
.venv/bin/python -m mypy .
.venv/bin/python -m pytest -q

export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
. "$NVM_DIR/nvm.sh"
nvm use >/dev/null
export TMPDIR=/tmp
export WRANGLER_LOG_PATH=/tmp/codex-wrangler
npm --prefix web run check
'''
